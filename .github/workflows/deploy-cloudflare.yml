name: Deploy Airdrop Radar Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply airdrop-radar --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Configure ADMIN_TOKEN
        if: ${{ env.ADMIN_TOKEN != '' }}
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Configure CoinGecko key
        if: ${{ env.COINGECKO_API_KEY != '' }}
        run: printf '%s' "$COINGECKO_API_KEY" | npx wrangler secret put COINGECKO_API_KEY

      - name: Configure X bearer token
        if: ${{ env.X_BEARER_TOKEN != '' }}
        run: printf '%s' "$X_BEARER_TOKEN" | npx wrangler secret put X_BEARER_TOKEN

      - name: Seed DeFiLlama data
        if: ${{ env.ADMIN_TOKEN != '' }}
        run: |
          sleep 5
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            "https://bitter-disk-3576weather-edge-worker.digitaldragoworkspace.workers.dev/api/collect/defillama"

      - name: Health check
        run: |
          curl --fail --show-error --silent \
            "https://bitter-disk-3576weather-edge-worker.digitaldragoworkspace.workers.dev/health"
